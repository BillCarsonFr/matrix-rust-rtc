#
# TLS front for the interop stack. Modelled on Element Call's
# backend/dev_nginx.conf, minus federation between two homeservers and minus
# the element-call origin (Element Web serves that widget itself).
#
# Certificate is minted by the init-certs service into ../data/tls; the names
# below all live on the wildcard leaf (*.m.localhost).

# ---------------------------------------------------------------------------
# Synapse. 443 for clients, 8448 for lk-jwt's federation OpenID lookup —
# gomatrixserverlib speaks HTTPS only, which is the entire reason this proxy
# exists at all. There is no /.well-known/matrix/server, so lk-jwt's discovery
# falls through to <server_name>:8448, which the compose alias resolves here.
# ---------------------------------------------------------------------------
server {
    listen                  443 ssl;
    listen                  [::]:443 ssl;
    listen                  8448 ssl;
    listen                  [::]:8448 ssl;
    server_name             synapse.m.localhost;
    ssl_certificate         /etc/nginx/tls/m.localhost.crt;
    ssl_certificate_key     /etc/nginx/tls/m.localhost.key;

    # Served here rather than by Synapse (`serve_server_wellknown`) because
    # this is where the MatrixRTC focus gets advertised: it is what both
    # Element Call and our Rust client read to find the authorisation service.
    location /.well-known/matrix/client {
        add_header Access-Control-Allow-Origin *;
        default_type application/json;
        return 200 '{"m.homeserver": {"base_url": "https://synapse.m.localhost"}, "org.matrix.msc4143.rtc_foci": [{"type": "livekit", "livekit_service_url": "https://matrix-rtc.m.localhost/livekit/jwt"}]}';
    }

    location ~ ^(/_matrix|/_synapse) {
        proxy_pass              http://synapse:8008;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        # Sync is long-polling; the default 60s read timeout would cut it.
        proxy_read_timeout      300;
        client_max_body_size    50M;
    }
}

# ---------------------------------------------------------------------------
# MatrixRTC: the authorisation service and the SFU signalling socket, on one
# origin. Both upstreams are addressed as `livekit` because the base stack runs
# lk-jwt with `network_mode: "service:livekit"` — it has no hostname of its own.
# ---------------------------------------------------------------------------
server {
    listen                  443 ssl;
    listen                  [::]:443 ssl;
    server_name             matrix-rtc.m.localhost;
    ssl_certificate         /etc/nginx/tls/m.localhost.crt;
    ssl_certificate_key     /etc/nginx/tls/m.localhost.key;

    http2 on;

    # Trailing slash on proxy_pass strips the prefix: /livekit/jwt/get_token
    # upstream becomes /get_token.
    location ^~ /livekit/jwt/ {
        proxy_pass          http://livekit:6080/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location ^~ /livekit/sfu/ {
        proxy_pass          http://livekit:7880/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_buffering     off;
        proxy_send_timeout  120;
        proxy_read_timeout  120;
    }
}

# ---------------------------------------------------------------------------
# Element Web — and, from the same origin, the Element Call widget it bundles
# at /widgets/element-call/index.html.
# ---------------------------------------------------------------------------
server {
    listen                  443 ssl;
    listen                  [::]:443 ssl;
    server_name             app.m.localhost;
    ssl_certificate         /etc/nginx/tls/m.localhost.crt;
    ssl_certificate_key     /etc/nginx/tls/m.localhost.key;

    location / {
        proxy_pass          http://element-web:8081;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
