#
# Self-contained MatrixRTC backend: Synapse + lk-jwt-service + LiveKit SFU.
# Used by the e2e_call integration test (CI) and for local development.
# See README.md. All state lives under ./data/ (git-ignored).

name: matrix-rtc-backend

volumes:
  # Synapse state (sqlite DB, media, signing key). See the synapse service's
  # volumes comment for why this must not be a bind mount.
  synapse-data:

services:
  # One-shot, idempotent: mints the self-signed cert Synapse's federation
  # listener needs. lk-jwt-service validates OpenID tokens over the federation
  # API, which gomatrixserverlib only speaks over HTTPS —
  # LIVEKIT_INSECURE_SKIP_VERIFY_TLS skips certificate *verification*, not TLS
  # itself. The cert never leaves the compose network and is generated, not
  # committed, so no private key lives in git.
  init-certs:
    image: alpine/openssl:3.3.2
    entrypoint: /bin/sh
    command:
      - -c
      - |
        [ -f /certs/synapse.key ] || openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout /certs/synapse.key -out /certs/synapse.crt -days 3650 \
          -subj "/CN=synapse" -addext "subjectAltName=DNS:synapse"
    volumes:
      - ./data/tls:/certs

  # `latest` keeps us on current experimental-MSC behaviour (msc4354 sticky
  # events), at the cost of drift risk. If a Synapse release breaks the stack,
  # pin by digest until fixed: ghcr.io/element-hq/synapse:latest@sha256:<...>
  # (grab the last good digest from a green CI run's pull log).
  synapse:
    image: ghcr.io/element-hq/synapse:latest
    # The service name doubles as server_name: gomatrixserverlib's federation
    # discovery (well-known -> SRV -> <server_name>:8448) resolves it inside
    # the compose network, so lk-jwt-service reaches the TLS listener directly.
    environment:
      SYNAPSE_CONFIG_PATH: /cfg/homeserver.yaml
      UID: "0"
      GID: "0"
    volumes:
      - ./synapse/homeserver.yaml:/cfg/homeserver.yaml:ro
      - ./synapse/log.config:/cfg/log.config:ro
      # Named volume, NOT a bind mount: synapse's sqlite over a macOS/Windows
      # bind mount produces `sqlite3.OperationalError: disk I/O error` under
      # load (observed wedging the whole homeserver mid-test). The volume is
      # removed by `docker compose down -v` (make backend-down), so every
      # stack restart starts from a clean homeserver — everything in it is
      # throwaway dev state (test users are provisioned per run).
      - synapse-data:/data
      - ./data/tls:/data/tls:ro
    ports:
      # Client-server API, plain HTTP. 8448 (federation, TLS) is deliberately
      # NOT published: only lk-jwt-service needs it, in-network.
      - "8008:8008"
    depends_on:
      init-certs:
        condition: service_completed_successfully
    # The image ships a curl-based healthcheck with a 15s interval; override it
    # to converge faster on CI.
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  # MatrixRTC authorisation service (MSC4195 /get_token).
  auth-service:
    image: ghcr.io/element-hq/lk-jwt-service:0.4.4
    # lk-jwt uses LIVEKIT_URL for two things at once: the URL it hands back to
    # clients in /get_token responses, AND its own RoomService endpoint for
    # creating the room on the SFU (full-access path). One URL must therefore
    # work from the host and from inside this container. Sharing the SFU's
    # network namespace makes `localhost:7880` mean the SFU in both places
    # (host side via the published port). DNS for `synapse` still resolves —
    # the shared namespace is livekit's, which sits on the compose network.
    network_mode: "service:livekit"
    environment:
      LIVEKIT_JWT_PORT: "6080"
      LIVEKIT_URL: "${LIVEKIT_WS_URL:-ws://localhost:7880}"
      LIVEKIT_KEY: devkey
      LIVEKIT_SECRET: secret
      LIVEKIT_FULL_ACCESS_HOMESERVERS: synapse
      # Synapse's federation listener uses the self-signed cert from init-certs.
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
      # Verbose by default: this is a dev/test stack and the auth hop is the
      # most opaque failure point (CI dumps these logs after every run).
      LIVEKIT_LOG_LEVEL: debug
    depends_on:
      synapse:
        condition: service_healthy
      livekit:
        condition: service_healthy
    # No healthcheck: 0.4.4 is a FROM-scratch image (no shell, no healthcheck
    # binary — that only exists on unreleased main). wait-ready.sh probes
    # http://localhost:6080/healthz from the host instead. Once a release ships
    # /lk-jwt-service-healthcheck, add it here and drop the host-side probe.

  livekit:
    image: livekit/livekit-server:v1.10.1
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880/tcp" # signalling WebSocket + HTTP
      - "7881:7881/tcp" # ICE over TCP (fallback when UDP is blocked)
      - "50100-50200:50100-50200/udp" # WebRTC media (keep the range small: one iptables entry per port)
      - "6080:6080/tcp" # auth-service (it shares this network namespace, see above)
    # Same probe the official livekit-helm chart uses; the alpine base ships
    # busybox wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7880/"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ---- Second focus (MSC4195 multi-SFU scenarios) --------------------------
  # A full second SFU + authorisation-service pair, so tests can put each
  # participant on a different focus and exercise cross-focus subscribe. Same
  # pattern as the first pair; every published port is shifted, and the UDP
  # media ranges must never overlap between the two SFUs.

  auth-service2:
    image: ghcr.io/element-hq/lk-jwt-service:0.4.4
    network_mode: "service:livekit2"
    environment:
      LIVEKIT_JWT_PORT: "6081"
      LIVEKIT_URL: "${LIVEKIT_WS_URL_2:-ws://localhost:7890}"
      LIVEKIT_KEY: devkey
      LIVEKIT_SECRET: secret
      LIVEKIT_FULL_ACCESS_HOMESERVERS: synapse
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
      LIVEKIT_LOG_LEVEL: debug
    depends_on:
      synapse:
        condition: service_healthy
      livekit2:
        condition: service_healthy

  livekit2:
    image: livekit/livekit-server:v1.10.1
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit2.yaml:/etc/livekit.yaml:ro
    ports:
      - "7890:7890/tcp" # signalling WebSocket + HTTP
      - "7891:7891/tcp" # ICE over TCP
      - "50300-50400:50300-50400/udp" # WebRTC media (distinct from SFU 1's range)
      - "6081:6081/tcp" # auth-service2 (shares this network namespace)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7890/"]
      interval: 3s
      timeout: 5s
      retries: 20
