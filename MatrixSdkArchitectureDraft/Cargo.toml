[package]
name = "matrix-rtc"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "MatrixRTC SDK — draft skeleton for the architecture in ../MatrixSdkArchitecture.md. All method bodies are todo!()."

# Detach from the surrounding matrix-rust-rtc workspace.
[workspace]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# The single binding surface (src/uniffi_api): Swift and Kotlin via
# uniffi-bindgen, React Native and web/wasm via uniffi-bindgen-react-native.
uniffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
async-trait = "0.1"
# sync-only: watch/mpsc channels work on wasm32 too.
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "=0.31.2", features = ["tokio"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# What uniffi-bindgen-react-native's wasm mode builds on: no tokio runtime,
# Send/Sync requirements relaxed for the single-threaded JS environment.
uniffi = { version = "=0.31.2", features = ["wasm-unstable-single-threaded"], optional = true }
