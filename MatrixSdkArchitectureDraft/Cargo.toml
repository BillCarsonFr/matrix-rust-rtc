[package]
name = "matrix-rtc"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "MatrixRTC SDK — draft skeleton for the architecture in ../MatrixSdkArchitecture.md. All method bodies are todo!()."

# Detach from the surrounding matrix-rust-rtc workspace.
[workspace]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# The single binding surface (src/uniffi_api): Swift and Kotlin via
# uniffi-bindgen, React Native and web/wasm via uniffi-bindgen-react-native.
uniffi = ["dep:uniffi"]
# Test-only FFI surface (`uniffi_api::runtime_probe`) that exercises the
# runtime assumptions the crate rests on — `tokio::sync::watch` wake-ups,
# detached tasks and timers — through the real bindings. Enabled by the
# web-test-app harness, never by a shipping build.
runtime-probe = ["uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
async-trait = "0.1"
# The SAME feature set on every target, on purpose: the ubrn-generated wasm
# shim crate is edition 2018 (cargo feature resolver v1), which unifies
# target-specific features into every build — a native-only
# `rt-multi-thread` there breaks the wasm build with "Only features
# sync,macros,io-util,rt,time are supported on wasm". `sync`, `rt` and
# `time` are all in tokio's wasm-allowed set; `executor` uses `rt`/`time`
# natively only (a current-thread runtime on its own thread) and never on
# wasm, where tokio timers would panic.
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
# Key material and rotation jitter. getrandom 0.2 needs `js` to build for
# wasm32-unknown-unknown (0.3 would need an extra --cfg the ubrn build does
# not set); the feature is a no-op elsewhere, so it is on unconditionally —
# the ubrn shim's v1 resolver would unify it anyway.
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
# MSC4195 pseudonymous participant identities (sha256 over the canonical triple).
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "=0.31.2", features = ["tokio"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# What uniffi-bindgen-react-native's wasm mode builds on: no tokio runtime,
# Send/Sync requirements relaxed for the single-threaded JS environment.
uniffi = { version = "=0.31.2", features = ["wasm-unstable-single-threaded"], optional = true }
# `executor` on wasm: detached tasks run on the JS microtask queue, timers are
# `setTimeout`, the clock is `Date.now()` (`std::time::SystemTime::now()`
# panics on wasm32-unknown-unknown). wasm-bindgen-futures is pinned to the
# release that pairs with wasm-bindgen 0.2.100 — the version ubrn's bundled
# CLI dictates (see web-test-app/Cargo.patch.toml); bump them together.
wasm-bindgen-futures = "=0.4.50"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"
