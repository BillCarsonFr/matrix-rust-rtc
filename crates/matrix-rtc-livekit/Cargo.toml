[package]
name = "matrix-rtc-livekit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MSC4195 LiveKit transport for MatrixRTC: SFU token exchange, media session, and E2EE key bridging."

[lib]
crate-type = ["rlib"]

[dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
# Keep default features (notably `tokio`, which enables the signal client) and
# select the rustls TLS backend for the SFU WebSocket/HTTP connections.
livekit = { version = "0.7", features = ["rustls-tls-native-roots"] }
matrix-sdk = { version = "0.18", optional = true }

[features]
# Provides a default `OpenIdTokenSource` implementation for `matrix_sdk::Client`.
# Enables the `connect` example. Off by default to keep the core crate light.
matrix-sdk = ["dep:matrix-sdk"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "connect"
required-features = ["matrix-sdk"]
