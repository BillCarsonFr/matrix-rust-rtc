[package]
name = "matrix-rtc-livekit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MSC4195 LiveKit transport for MatrixRTC: SFU token exchange, media session, and E2EE key bridging."

[lib]
crate-type = ["rlib"]

[dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core" }
# Transport-agnostic media model this crate implements (`transport_impl`).
matrix-rtc-media = { path = "../matrix-rtc-media" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
async-trait.workspace = true
log.workspace = true
# `media` uses tokio timers (interval / timeout_at) on top of the workspace rt+sync.
tokio = { workspace = true, features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
# Keep default features (notably `tokio`, which enables the signal client) and
# select the rustls TLS backend for the SFU WebSocket/HTTP connections. This
# pulls in libwebrtc (native C++) via webrtc-sys, so building this crate needs a
# C++ toolchain — CI jobs that lack one must not build this crate.
#
# BOTH root stores, deliberately. `rustls-tls-native-roots` alone breaks the
# signal WebSocket on every Android device: `rustls-native-certs` probes the
# filesystem (/etc/ssl/certs, SSL_CERT_FILE, ...) and Android keeps its trust
# store in the Java KeyStore instead, so it returns zero certificates and
# tokio-tungstenite fails the connection with "no native root CA certificates
# found (errors: [])". Nothing failed to parse — there was nothing to read.
#
# tokio-tungstenite is written for the two to coexist (src/tls.rs): an empty
# native store is fatal *only* when `rustls-tls-webpki-roots` is off, and the
# webpki roots are then unioned into the same store. So Android falls back to
# the bundled roots while desktop keeps the system store, including any
# enterprise CA an admin added there.
#
# Not a swap, for two reasons. Desktop would lose user/enterprise-added CAs.
# And livekit-api gates its WSS-over-HTTP-proxy path on
# `rustls-tls-native-roots` (signal_client/signal_stream.rs) — without it, any
# wss:// through a proxy becomes a hard "requires rustls-tls-native-roots".
#
# This does NOT give Android enterprise/internal CAs: nothing here can read the
# Java KeyStore. That needs a platform verifier
# (`rustls-platform-verifier`) plumbed through livekit-api, which calls
# `connect_async` without a connector and so cannot accept one today — an
# upstream change, not a local knob.
livekit = { version = "0.7", features = [
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
# Stream combinators for draining the LiveKit audio stream in the media helpers.
futures-util = "0.3"
# The experimental branch carries MSC4354 sticky-event support that the crates.io
# release lacks; the whole MatrixRTC signalling path (own membership, keep-alive,
# peer discovery) rides on it. See `matrix_bridge`. Keeps matrix-sdk's default
# features (e2e-encryption, sqlite, rustls-aws-lc-rs, automatic-room-key-
# forwarding) and adds sticky events.
#
# Key forwarding stays ON deliberately. Without it a freshly logged-in device
# cannot obtain the Megolm sessions for member events sent before it existed,
# and simply does not see those peers — the exact failure that makes an
# in-progress Element Call invisible to a new device. Tools that want the
# request/forward chatter out of their measurements switch it off per client at
# runtime instead; see `quiet_room_key_gossip` in `examples/load_test.rs`.
#
# Pinned to rev 3773300 ("Update ruma to the rewritten MSC4143"), which
# repoints ruma to `BillCarsonFr/ruma@3fc675d`. That ruma models the 2026
# MSC4143 rewrite — `member.membership`, `leave_reason`, `transports
# {published, can_subscribe}`, and an `m.rtc.encryption_key` content of
# `{room_id, member_id, media_key, format}` — matching what `matrix-rtc-core`
# puts on the wire, so ruma's typed events (e.g. `AnyToDeviceEvent`) can be
# used on RTC wire content again. Member events are still parsed with
# `matrix_rtc_core::RawStickyEventContent` (the core must not depend on ruma).
#
# The pin also carries 7603577 ("keep encryption info for sticky events"),
# which makes `StickyLiveEvent` expose `encryption_info().sender_device` — the
# only source for a member event's sending device now that MSC4143 has dropped
# `member.claimed_device_id`. See `matrix_bridge::snapshot`.
# `experimental-send-custom-to-device` exposes
# `Encryption::encrypt_and_send_raw_to_device`, used to distribute MSC4143 media
# keys as Olm-encrypted to-device messages (see `matrix_bridge`). It pulls in
# `e2e-encryption`, already on via defaults.
matrix-sdk = { git = "https://github.com/BillCarsonFr/matrix-rust-sdk", rev = "377330059c3a335ab36d190fc10b87de3427c6b3", optional = true, features = ["unstable-msc4354", "experimental-send-custom-to-device"] }
# Drives sliding sync (which auto-enables the sticky extension under
# `unstable-msc4354`) plus the encryption sync, so sticky events actually flow.
# Encryption support rides along via matrix-sdk's default features; ui only needs
# the sticky feature for unification with matrix-sdk-base.
matrix-sdk-ui = { git = "https://github.com/BillCarsonFr/matrix-rust-sdk", rev = "377330059c3a335ab36d190fc10b87de3427c6b3", optional = true, features = ["unstable-msc4354"] }
# Only needed to name `crypto::CollectStrategy` (the key-sharing strategy passed
# to `encrypt_and_send_raw_to_device`); matrix-sdk does not re-export it. Same
# rev as matrix-sdk so cargo unifies the source; `e2e-encryption` gates the
# `crypto` re-export.
matrix-sdk-base = { git = "https://github.com/BillCarsonFr/matrix-rust-sdk", rev = "377330059c3a335ab36d190fc10b87de3427c6b3", optional = true, features = ["e2e-encryption"] }

[target.'cfg(target_os = "android")'.dependencies]
# For the `android::initialize_android` re-export's signature; unifies with
# the jni version libwebrtc itself uses.
jni = "0.21"

[features]
# Provides a default `OpenIdTokenSource` implementation for `matrix_sdk::Client`,
# the `matrix_bridge` (SDK-backed command sender + sticky-event bridge into
# matrix-rtc-core), and the `connect` / `e2e_call` examples. Off by default to
# keep the base crate light and buildable without the git SDK.
matrix-sdk = ["dep:matrix-sdk", "dep:matrix-sdk-ui", "dep:matrix-sdk-base"]
# Exposes the test-only parts of the `media` module (tone generator, Goertzel
# frequency detector) for examples and integration tests; recording/WAV
# helpers in that module are shipped API and need no feature. Otherwise the
# test-only parts compile only under `cfg(test)`.
#
# Also turns on matrix-sdk's `testing`, whose only use here is
# `Client::olm_machine_for_testing` — the one public route to the `OlmMachine`,
# and so the only way to reach `set_room_key_forwarding_enabled`. It costs
# `wiremock` and friends in the graph, which is what a testing feature is for.
testing = ["matrix-sdk?/testing"]

# The end-to-end call test (see tests/E2E_CALL.md). `required-features` keeps
# plain `cargo test --workspace` from compiling it (and the git SDK + libwebrtc
# behind it); the `#[ignore]` inside keeps `--all-features` runs from executing
# it without the demo/backend stack.
[[test]]
name = "e2e_call"
path = "tests/e2e_call/main.rs"
required-features = ["matrix-sdk", "testing"]

[dev-dependencies]
# `signal` for the join_and_record example's Ctrl-C hang-up.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Argument parsing for the `load_test` example. A dev-dependency on purpose:
# examples may use them, so clap never enters the library's dependency graph.
clap = { version = "4", features = ["derive", "env"] }
# The dependency tree pulls in rustls with BOTH the `ring` and `aws-lc-rs`
# crypto backends (livekit/reqwest vs matrix-sdk), so rustls cannot pick a
# process-level `CryptoProvider` automatically and panics on first TLS use. The
# example installs `aws-lc-rs` explicitly (matches matrix-sdk's default); this
# dev-dep gives us the provider module to call `install_default()`.
rustls = { version = "0.23", features = ["aws_lc_rs"] }

[[example]]
name = "connect"
required-features = ["matrix-sdk"]

# The quick-start example (see README.md). `testing` only for the optional
# PUBLISH_TONE test-tone publisher, so two instances can call each other.
[[example]]
name = "join_and_record"
required-features = ["matrix-sdk", "testing"]

# The load generator (see README.md). Publishes a video file from N devices of
# one account. Its tone generator is local, so `testing` is here for one reason
# only: reaching the `OlmMachine`.
[[example]]
name = "load_test"
# `testing` is only for `Client::olm_machine_for_testing`, used to keep room-key
# gossip out of the to-device traffic this tool measures.
required-features = ["matrix-sdk", "testing"]
