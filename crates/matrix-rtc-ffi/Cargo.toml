[package]
name = "matrix-rtc-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uniffi.workspace = true
async-trait.workspace = true
futures = "0.3"
log.workspace = true
# `RUST_LOG`-style filter specs for `setup_logging`. No regex: message-body
# filtering is not exposed over the FFI, and it is a large dependency to ship
# in a mobile artifact. Held at 0.1 to match `android_logger`'s own requirement
# so Android links one copy rather than two.
env_filter = { version = "0.1", default-features = false }

# --- `media` feature only (pulls libwebrtc; see the feature's comment) ------
matrix-rtc-media = { path = "../matrix-rtc-media", optional = true }
# Deliberately WITHOUT the `matrix-sdk` feature: the FFI host brings its own
# Matrix stack; only the transport layer (token exchange, SFU, E2EE bridge)
# is used.
matrix-rtc-livekit = { path = "../matrix-rtc-livekit", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# For the JNI_OnLoad libwebrtc initialisation (media feature). Android-only,
# so it never affects other targets.
jni = { version = "0.21", optional = true }
# logcat writer for `setup_logging`. Used as a plain writer, not as the global
# logger — it handles the 4 KiB logcat line split and tag nul-termination.
# `default-features = false` drops its `regex` feature, matching our
# `env_filter` (same crate, so the features must not diverge).
android_logger = { version = "0.15", default-features = false }

[features]
# Media over the FFI: participants with frame streams, publishing, and
# constraints (src/media/). Off by default — it pulls the LiveKit client and
# libwebrtc (native C++, needs a C++ toolchain, adds ~8-15 MB per ABI). The
# slim signalling-only artifact is the default build.
media = [
    "dep:matrix-rtc-media",
    "dep:matrix-rtc-livekit",
    "dep:reqwest",
    "dep:jni",
    "dep:webrtc-sys-build",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/time",
    # `async_runtime = "tokio"` on exported async fns needs uniffi's tokio
    # integration (async_compat).
    "uniffi/tokio",
]

[build-dependencies]
# Re-emits libwebrtc's `Java_*` JNI link args against our cdylib — see the
# module docs in build.rs for why `webrtc-sys` cannot do this itself. Already
# in the build graph for any `media` build (webrtc-sys builds with it), so this
# costs nothing there, and stays out of the slim build entirely.
#
# Keep this a caret requirement, NOT `=0.3.x`: it must resolve to the exact
# same version webrtc-sys uses, or the symbol list is read by one copy of the
# crate while `livekit` links libwebrtc through another.
webrtc-sys-build = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }


