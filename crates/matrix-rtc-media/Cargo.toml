[package]
name = "matrix-rtc-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-agnostic MatrixRTC media model: participants, frame streams, constraints, and the call engine."

[dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core" }
# The engine's actor loop multiplexes channels with `tokio::select!`
# (`macros`) and drives backoff/idle-grace timers (`time`).
tokio = { workspace = true, features = ["macros", "time"] }
# `BoxStream` for the frame streams handed out by `RemoteTrackHandle`. Only the
# type is needed here; combinators stay in the transport implementations.
futures-core = "0.3"
async-trait.workspace = true
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }
futures-util = "0.3"
