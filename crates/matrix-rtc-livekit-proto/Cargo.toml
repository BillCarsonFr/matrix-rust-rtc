[package]
name = "matrix-rtc-livekit-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The pure MSC4195 LiveKit control plane: identity derivations, token exchange shapes, and dialect selection. No IO, no libwebrtc — compiles for wasm32."

[dependencies]
# `RtcIdentityMapper`, the identity seam `identity_mapper` produces.
matrix-rtc-core = { path = "../matrix-rtc-core" }
# `OpenIdToken` (what the token request carries) and the pre-2026 `compat`
# dialects the identity/endpoint choices key on. Base build only — no
# `matrix-sdk` feature, so this stays wasm-clean.
matrix-rtc-bridge = { path = "../matrix-rtc-bridge" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
sha2 = "0.10"
base64 = "0.22"
