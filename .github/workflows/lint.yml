name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rustfmt only parses source, so it needs no C++ toolchain and can cover
      # the whole workspace, including matrix-rtc-livekit.
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Exclude matrix-rtc-livekit for the same reason as the test job in
      # build-mobile.yml: it depends on livekit/libwebrtc (native C++) and
      # cannot build on this runner without a C++ toolchain. Its clippy coverage
      # stays a known gap until a C++-capable runner is available.
      - name: Run clippy
        run: cargo clippy --workspace --exclude matrix-rtc-livekit --all-targets -- -D warnings
